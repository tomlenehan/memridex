server {
  listen ${PORT};
  server_name _;

  # The API accepts profile photos up to 5 MB. Leave room for multipart form
  # data so Nginx forwards valid uploads instead of returning its default 413.
  client_max_body_size 6m;

  root /usr/share/nginx/html;
  index index.html index.htm;

  location ~ ^/(api|docs|redoc) {
    proxy_pass ${BACKEND_PROTOCOL}://${BACKEND_HOSTPORT};
    proxy_http_version 1.1;
    proxy_set_header Host $proxy_host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_buffering off;
    proxy_ssl_server_name on;
  }

  location / {
    try_files $uri /index.html;
  }
}
