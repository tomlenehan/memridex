<!doctype html>
<html lang="en">
  <head><meta charset="utf-8"><title>MemriPlace constellation star preview</title></head>
  <body style="margin:0;min-height:100vh;display:grid;place-items:center;background:#fffdf5;font-family:Georgia,serif;color:#17353b">
    <main style="text-align:center">
      <div id="star" style="width:320px;height:320px;margin:auto"></div>
      <h1>Your first memory is waiting.</h1>
    </main>
    <script type="module">
      import lottie from 'lottie-web/build/player/lottie_light'
      const player = lottie.loadAnimation({
        container: document.getElementById('star'),
        renderer: 'svg', loop: true, autoplay: true,
        path: '/animations/constellation-star.json'
      })
      player.addEventListener('DOMLoaded', () => document.body.dataset.animation = 'ready')
      player.addEventListener('data_failed', () => document.body.dataset.animation = 'failed')
    </script>
  </body>
</html>
