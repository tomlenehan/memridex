services:
  - type: web
    name: memribox-web
    runtime: docker
    plan: free
    region: oregon
    dockerfilePath: ./frontend/Dockerfile
    dockerContext: ./frontend
    healthCheckPath: /
    envVars:
      - key: PORT
        value: "10000"
      - key: BACKEND_HOSTPORT
        fromService:
          type: web
          name: memribox-api
          property: hostport

  - type: web
    name: memribox-api
    runtime: docker
    plan: free
    region: oregon
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    healthCheckPath: /docs
    envVars:
      - key: PORT
        value: "10000"
      - key: PROJECT_NAME
        value: MemriPlace
      - key: DOMAIN
        value: memribox-web.onrender.com
      - key: ENVIRONMENT
        value: production
      - key: BACKEND_CORS_ORIGINS
        value: https://memribox-web.onrender.com
      - key: DATABASE_URL
        fromDatabase:
          name: memribox-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: FIRST_SUPERUSER
        value: admin@example.com
      - key: FIRST_SUPERUSER_PASSWORD
        sync: false
      - key: USERS_OPEN_REGISTRATION
        value: "true"
      - key: OPENAI_API_KEY
        sync: false
      - key: OPENAI_REALTIME_MODEL
        value: gpt-realtime-2.1
      - key: OPENAI_REALTIME_VOICE
        value: marin
      - key: OPENAI_TRANSCRIPTION_MODEL
        value: gpt-transcribe
      - key: AWS_DEFAULT_REGION
        value: us-east-1

databases:
  - name: memribox-db
    plan: free
    region: oregon
    databaseName: memribox
    user: memribox
    postgresMajorVersion: "16"
