services:
  - type: web
    name: memribox-web
    runtime: docker
    plan: free
    region: oregon
    dockerfilePath: ./frontend/Dockerfile
    dockerContext: ./frontend
    healthCheckPath: /
    domains:
      - memriplace.com
    envVars:
      - key: PORT
        value: "10000"
      - key: BACKEND_HOSTPORT
        fromService:
          type: web
          name: memribox-api
          envVarKey: RENDER_EXTERNAL_HOSTNAME
      - key: BACKEND_PROTOCOL
        value: https

  - type: web
    name: memribox-api
    runtime: docker
    plan: 0.5c-512mb
    region: oregon
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    healthCheckPath: /docs
    disk:
      name: story-images
      mountPath: /app/uploads
      sizeGB: 1
    envVars:
      - key: PORT
        value: "10000"
      - key: PROJECT_NAME
        value: MemriPlace
      - key: DOMAIN
        value: memriplace.com
      - key: ENVIRONMENT
        value: production
      - key: BACKEND_CORS_ORIGINS
        value: https://memriplace.com,https://www.memriplace.com
      - key: DATABASE_URL
        fromDatabase:
          name: memribox-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: FIRST_SUPERUSER
        value: admin@example.com
      - key: FIRST_SUPERUSER_PASSWORD
        sync: false
      - key: USERS_OPEN_REGISTRATION
        value: "true"
      - key: OPENAI_API_KEY
        sync: false
      - key: OPENAI_REALTIME_MODEL
        value: gpt-realtime-2.1
      - key: OPENAI_REALTIME_VOICE
        value: marin
      - key: OPENAI_TRANSCRIPTION_MODEL
        value: gpt-transcribe

databases:
  - name: memribox-db
    plan: 0.1c-256mb
    diskSizeGB: 1
    region: oregon
    databaseName: memribox
    user: memribox
    postgresMajorVersion: "16"
